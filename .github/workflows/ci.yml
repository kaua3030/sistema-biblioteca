name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # Testes do Backend
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd app/backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd app/backend
          npm test --if-present

  # Testes do Frontend
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd app/frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd app/frontend
          npm test --if-present