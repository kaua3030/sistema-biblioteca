name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
    tags: [v1.0.0, v1.0.1]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      version:
        description: Versao fixa a publicar no GHCR (nao reutilize uma versao publicada)
        required: true
        type: choice
        options:
          - "1.0.0"
          - "1.0.1"
      frontend_api_url:
        description: URL publica da API que sera usada pelo frontend
        required: true
        default: http://localhost:8000/api
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Smoke - API essencial
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Instalar dependencias
        working-directory: app/backend
        run: npm ci

      - name: Executar smoke test
        working-directory: app/backend
        run: npm run test:smoke

  sanity-tests:
    name: Sanity - validacoes basicas
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Instalar dependencias do backend
        working-directory: app/backend
        run: npm ci

      - name: Executar sanity test do backend
        working-directory: app/backend
        run: npm run test:sanity

      - name: Instalar dependencias do frontend
        working-directory: app/frontend
        run: npm ci

      - name: Executar sanity test do frontend
        working-directory: app/frontend
        run: npm run test:sanity

  regression-tests:
    name: Regression - emprestimos com PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biblioteca_test
          POSTGRES_PASSWORD: biblioteca_test
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca_test -d biblioteca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://biblioteca_test:biblioteca_test@127.0.0.1:5432/biblioteca_test

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Instalar dependencias
        working-directory: app/backend
        run: npm ci

      - name: Executar regression test
        working-directory: app/backend
        run: npm run test:regression

  terraform-validate:
    name: Validar Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.0"

      - name: Verificar formatacao
        working-directory: terraform
        run: terraform fmt -check

      - name: Inicializar Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validar configuracao
        working-directory: terraform
        run: terraform validate

  docker-build:
    name: Construir imagens Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FRONTEND_API_URL: ${{ inputs.frontend_api_url || 'http://localhost:8000/api' }}
    needs:
      - smoke-tests
      - sanity-tests
      - regression-tests
      - terraform-validate

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7

      - name: Construir imagem do backend
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          docker build --tag biblioteca-backend:ci
          --label "org.opencontainers.image.source=$SOURCE_URL"
          app/backend

      - name: Construir imagem do frontend
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          docker build
          --build-arg "VITE_API_URL=$FRONTEND_API_URL"
          --label "org.opencontainers.image.source=$SOURCE_URL"
          --tag biblioteca-frontend:ci
          app/frontend

      - name: Executar e validar as imagens construidas
        env:
          BACKEND_IMAGE: biblioteca-backend:ci
          FRONTEND_IMAGE: biblioteca-frontend:ci
        run: |
          docker compose -f docker-compose.validacao.yml up -d --no-build banco backend frontend
          python3 scripts/validar-containers.py

      - name: Registrar logs em caso de falha
        if: failure()
        run: docker compose -f docker-compose.validacao.yml logs --no-color

      - name: Encerrar ambiente temporario
        if: always()
        run: docker compose -f docker-compose.validacao.yml down

      - name: Autenticar no GHCR
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Publicar as imagens construidas com versao fixa
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          IMAGE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            IMAGE_VERSION="${RELEASE_TAG#v}"
          fi
          case "$IMAGE_VERSION" in
            1.0.0|1.0.1) ;;
            *) echo "Versao nao permitida" >&2; exit 1 ;;
          esac
          image_repository="${IMAGE_REPOSITORY,,}"
          for component in backend frontend; do
            image="ghcr.io/${image_repository}-${component}:${IMAGE_VERSION}"
            docker tag "biblioteca-${component}:ci" "$image"
            docker push "$image"
            echo "Publicado: $image" >> "$GITHUB_STEP_SUMMARY"
          done

  pipeline-success:
    name: Resultado do pipeline
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Informar sucesso
        run: echo "Pipeline aprovado"
