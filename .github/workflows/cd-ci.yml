name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Smoke - API essencial
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar deps
        working-directory: app/backend
        run: npm ci

      - name: Rodar smoke
        working-directory: app/backend
        run: npm run test:smoke

  sanity-tests:
    name: Sanity - validações
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Backend sanity
        working-directory: app/backend
        run: npm run test:sanity

  regression-tests:
    name: Regression - PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Rodar regression
        working-directory: app/backend
        run: npm run test:regression

  frontend-tests:
    name: sanity test
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Instalar dependências
        working-directory: app/frontend
        run: npm ci

      - name: Executar testes
        working-directory: app/frontend
        run: npm test

  terraform-validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.0

      - name: Verificar formatação
        working-directory: terraform
        run: terraform fmt -check

      - name: Inicializar Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validar configuração
        working-directory: terraform
        run: terraform validate

  docker-build:
    name: Construir imagens Docker
    runs-on: ubuntu-latest
    needs: [smoke-tests, sanity-tests, regression-tests, terraform-validate]
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Construir imagem do backend
        run: docker build --tag biblioteca-backend:ci app/backend

      - name: Construir imagem do frontend
        run: >-
          docker build
          --build-arg VITE_API_URL=http://localhost:8000/api
          --tag biblioteca-frontend:ci
          app/frontend

  pipeline-success:
    name: Resultado do pipeline
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Informar sucesso
        run: echo "SUCCESS"
