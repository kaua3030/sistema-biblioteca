name: Publicar imagens no GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar, por exemplo v1.0.1"
        required: true
        default: "v1.0.1"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Testes do backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biblioteca_test
          POSTGRES_PASSWORD: biblioteca_test
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca_test -d biblioteca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://biblioteca_test:biblioteca_test@127.0.0.1:5432/biblioteca_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Instalar dependências
        working-directory: app/backend
        run: npm ci

      - name: Executar testes
        working-directory: app/backend
        run: npm test

  frontend-tests:
    name: Testes do frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Instalar dependências
        working-directory: app/frontend
        run: npm ci

      - name: Executar testes
        working-directory: app/frontend
        run: npm test

  publish:
    name: Publicar imagens
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Definir versão da imagem
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar backend
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sistema-biblioteca-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/sistema-biblioteca-backend:latest

      - name: Construir e publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          build-args: |
            VITE_API_URL=http://localhost:8000/api
          tags: |
            ghcr.io/${{ github.repository_owner }}/sistema-biblioteca-frontend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/sistema-biblioteca-frontend:latest