# Substitua os IPs e a chave SSH antes de executar o playbook.
[biblioteca_backend]
backend ansible_host=IP_DO_BACKEND

[biblioteca_frontend]
frontend ansible_host=IP_DO_FRONTEND

[servidores_biblioteca:children]
biblioteca_backend
biblioteca_frontend

[servidores_biblioteca:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/sua_chave.pem

[biblioteca_backend:vars]
biblioteca_componente=backend

[biblioteca_frontend:vars]
biblioteca_componente=frontend
