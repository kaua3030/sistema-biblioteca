apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: biblioteca-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblioteca-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: biblioteca-db
  template:
    metadata:
      labels:
        app: biblioteca-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: biblioteca-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteca-db-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: biblioteca-db-secret
                  key: DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: biblioteca-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: biblioteca-db
spec:
  type: ClusterIP
  selector:
    app: biblioteca-db
  ports:
    - port: 5432
      targetPort: 5432