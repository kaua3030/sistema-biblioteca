apiVersion: apps/v1
kind: Deployment
metadata:
  name: sistema-biblioteca
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sistema-biblioteca
  template:
    metadata:
      labels:
        app: sistema-biblioteca
    spec:
      containers:
        - name: biblioteca
          image: ghcr.io/vitorcruz1520-cloud/sistema-biblioteca:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: biblioteca-db
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: biblioteca-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteca-db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: biblioteca-db-secret
                  key: DB_NAME
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10