apiVersion: v1
kind: Service
metadata:
  name: sistema-biblioteca-service
spec:
  type: NodePort
  selector:
    app: sistema-biblioteca
  ports:
    - protocol: TCP
      port: 80         # Porta lógica interna do Service
      targetPort: 3000 # Porta onde o contêiner Node está ouvindo
      nodePort: 30080  # Porta que ficará acessível na sua máquina local (http://localhost:30080)
