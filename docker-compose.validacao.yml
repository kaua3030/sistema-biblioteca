name: biblioteca-validacao

services:
  banco:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: biblioteca_test
      POSTGRES_PASSWORD: biblioteca_test
      POSTGRES_DB: biblioteca_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca_test -d biblioteca_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend-tests:
    image: node:22-alpine
    profiles: [tests]
    working_dir: /app
    volumes:
      - ./app/backend:/source:ro
    environment:
      TEST_DATABASE_URL: postgresql://biblioteca_test:biblioteca_test@banco:5432/biblioteca_test
    depends_on:
      banco:
        condition: service_healthy
    command: sh -c "cp -a /source/. /app && npm ci --cache /tmp/npm-cache && npm test"

  frontend-tests:
    image: node:22-alpine
    profiles: [tests]
    working_dir: /app
    volumes:
      - ./app/frontend:/source:ro
    command: sh -c "cp -a /source/. /app && npm ci --cache /tmp/npm-cache && npm test"

  backend:
    image: ${BACKEND_IMAGE:-biblioteca-backend:validacao}
    build: ./app/backend
    environment:
      PORT: 8000
      CORS_ORIGIN: http://localhost:13000
      DB_HOST: banco
      DB_PORT: 5432
      DB_USER: biblioteca_test
      DB_PASSWORD: biblioteca_test
      DB_NAME: biblioteca_test
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      banco:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-biblioteca-frontend:validacao}
    build:
      context: ./app/frontend
      args:
        VITE_API_URL: http://localhost:18000/api
    ports:
      - "127.0.0.1:13000:3000"
